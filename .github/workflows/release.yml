  containerize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # needs: release
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for cosign signing

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          # ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Login to container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build, tag and push docker image
        env:
          IMAGE: ghcr.io/mikamk4/mex-test
          TAG: v0.1.0
        run: |
          docker build . \
          --tag ${IMAGE}:latest \
          --tag ${IMAGE}:${{ github.sha }} \
          --tag ${IMAGE}:${TAG}
          docker push --all-tags ${IMAGE}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign docker images
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          COSIGN_PRIVATE_KEY: ${{ secrets.MEX_SIGNING_KEY }}
          COSIGN_PASSWORD: ""
          COSIGN_PUBLIC_KEY: ${{ vars.MEX_SIGNING_PUB }}
        run: |
          # Sign each tag separately and attach signatures to the registry
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            -a "repo=ghcr.io/mikamk4/mex-test" \
            -a "workflow=${GITHUB_WORKFLOW}" \
            -a "ref=${GITHUB_REF}" \
            ${IMAGE}:latest
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            -a "repo=ghcr.io/mikamk4/mex-test" \
            -a "workflow=${GITHUB_WORKFLOW}" \
            -a "ref=${GITHUB_REF}" \
            ${IMAGE}:${{ github.sha }}
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            -a "repo=ghcr.io/mikamk4/mex-test" \
            -a "workflow=${GITHUB_WORKFLOW}" \
            -a "ref=${GITHUB_REF}" \
            ${IMAGE}:${TAG}

          # Verify signatures
          cosign verify --key env://COSIGN_PUBLIC_KEY ${IMAGE}:${TAG}

